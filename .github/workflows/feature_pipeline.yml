name: AQI Feature Pipeline

on:
  schedule:
    # Every hour
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:

  feature-pipeline:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------
      # 4. Run data collection
      # --------------------------------------------------

      - name: Update AQI data
        env:
          AQICN_API_KEY: ${{ secrets.AQICN_API_KEY }}
        run: |
          python src/update_daily_data.py


      # --------------------------------------------------
      # 5. Run feature engineering
      # --------------------------------------------------

      - name: Preprocess data
        run: |
          python src/preprocess_daily_data.py


      # --------------------------------------------------
      # 6. Commit updated data
      # --------------------------------------------------

      - name: Commit updated features
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          git diff --cached --quiet || \
            git commit -m "Update AQI features"

          git push